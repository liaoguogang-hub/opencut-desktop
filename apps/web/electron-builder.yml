appId: app.opencut.desktop
productName: OpenCut Desktop
copyright: Copyright © 2026 OpenCut
directories:
  output: release
  buildResources: build

files:
  - electron/**/*
  - .next/static/**/*
  - .next/types/**/*
  - .next/BUILD_ID
  - public/**/*
  - src/**/*
  - next.config.ts
  - next-env.d.ts
  - package.json
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/node_modules/*.d.ts"
  - "!**/node_modules/.bin"

asarUnpack:
  - "**/*.node"

# The Next.js standalone output (.next/standalone) carries its own runtime
# node_modules tree. electron-builder prunes node_modules from the asar by
# default, so we copy the whole directory out-of-band to resources/. The
# app then resolves server.js via process.resourcesPath/.next/standalone.
extraResources:
  - from: ".next/standalone"
    to: ".next/standalone"
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "${productName}-Setup-${version}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: OpenCut Desktop
  uninstallDisplayName: OpenCut Desktop
  deleteAppDataOnUninstall: true

publish: null